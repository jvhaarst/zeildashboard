name: Build and publish dashboard image

on:
  push:
    branches:
      - main
    paths:
      - 'rhine-sailing-conditions/examples/**'
      - 'rhine-sailing-conditions/includes/class-assessment.php'
      - 'Dockerfile'
      - 'VERSION'
      - '.github/workflows/docker-publish.yaml'
  # Pull requests build the image but publish nothing. This is what Renovate
  # automerge gates on.
  pull_request:
    paths:
      - 'rhine-sailing-conditions/examples/**'
      - 'rhine-sailing-conditions/includes/class-assessment.php'
      - 'Dockerfile'
      - 'VERSION'
      - '.github/workflows/docker-publish.yaml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/zeildashboard

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compute image version
        id: ver
        run: echo "version=$(cat VERSION).${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v7
        with:
          context: .
          # arm64 is emulated through QEMU and is the slow half of this build.
          # A pull request only needs to prove the image still builds, so it
          # builds amd64 alone; main still publishes both.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
